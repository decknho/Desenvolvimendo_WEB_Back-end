<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>Lista de Produtos</title>
	<link href="/webjars/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet" />
    
    <link rel="stylesheet" th:href="@{/css/style.css}">
    
    <script src="/webjars/jquery/3.5.1/jquery.slim.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
	<script src="/webjars/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</head>

<body>
	<div class="container">
	
	<h1>Produtos</h1>
	
	<a th:href="@{/produtos/cadastro}" class="btn btn-info btn-sm">Novo Produto</a>
	
	<table>
		<thead>
			<tr>
				<th>ID</th>
				<th>Nome</th>
				<th>Preço</th>
				<th>Estoque</th>
				<th>Ações</th>
			</tr>
		</thead>
		<tbody>
			<tr th:each="p : ${produtos}">
				<td th:text="${p.id}"></td>
				<td th:text="${p.nome}"></td>
				<td th:text="${p.preco}"></td>
				<td th:text="${p.estoque ? 'Disponível' : 'Indisponível'}"></td>
				<td>
					<a class="btn btn-info btn-sm" th:href="@{/tarefas/editar/{id}(id=${p.id})}">
		            	<span class="oi oi-brush" title="Editar" aria-hidden="true">Editar</span>
		            </a>
					<button th:id="${'btn_tarefas/excluir/' + p.id}" type="button"
						class="btn btn-danger btn-sm" data-toggle="modal" data-target="#myModal">Excluir
					</button>
				</td>
			</tr>
		</tbody>
	</table>
	<div th:replace="~{fragments/modal :: modal}"></div>
	<br>
	<a th:href="@{/}" class="btn btn-info btn-sm">Voltar</a>
	
	</div>
	<div th:replace="~{fragments/script}"></div>
</body>

</html>
