<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<title>Lista de Clientes</title>
    <meta charset="UTF-8">
    
    <link href="/webjars/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet" />
    
    <link rel="stylesheet" th:href="@{/css/style.css}">
    
    <script src="/webjars/jquery/3.5.1/jquery.slim.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
	<script src="/webjars/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</head>
<body>

<div class="container">

<h1>Clientes</h1>

<a th:href="@{/clientes/cadastro}" class="btn btn-info btn-sm">Novo Cliente</a>

<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Cliente desde</th>
            <th>Ações</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="c : ${clientes}">
            <td th:text="${c.id}"></td>
            <td th:text="${c.nome}"></td>
            <td th:text="${#temporals.format(c.clienteDesde, 'dd-MM-yyyy')}"></td>
            <td>
                <a class="btn btn-info btn-sm" th:href="@{/tarefas/editar/{id}(id=${c.id})}">
		            	<span class="oi oi-brush" title="Editar" aria-hidden="true">Editar</span>
		        </a>
                <button th:id="${'btn_tarefas/excluir/' + c.id}" type="button"
						class="btn btn-danger btn-sm" data-toggle="modal" data-target="#myModal">Excluir
				</button>
            </td>
        </tr>
    </tbody>
</table>
<div th:replace="~{fragments/modal :: modal}"></div>
<br>
<a th:href="@{/}" class="btn btn-info btn-sm">Voltar</a>
</div>
<div th:replace="~{fragments/modal :: modal}"></div>
</body>
</html>
